name: CI

# 一次 push 只出一个 workflow，内含两个 job：
#   test           —— 锁校验 / ruff / bandit+pip-audit / SBOM / 全量单测 / Docker 集成测试
#   build-and-push —— 构建 amd64+arm64 镜像并推 Docker Hub（needs: test，测试不过就不发布）
#
# 合并前这是两个独立文件，互不依赖并行跑：Tests 红着的 commit 照样会把镜像推成
# :latest（2026-08-07 实际发生过一次）。现在 build 由 needs 串在 test 之后。
#
# 唯一需要保密的是 token，只存在 GitHub 仓库 Secrets（绝不写进代码）：
#   DOCKERHUB_TOKEN = Docker Hub Access Token（用 token，不要用账号密码）
# 设置位置：仓库 → Settings → Secrets and variables → Actions → New repository secret
#
# 用户名不走 Secret：它已经明文出现在下面的镜像 tag 里（thomas1997/ombre-brain），
# 本身不是机密。放进 Secret 只会多一个「忘了配就登录失败」的失败点。

on:
  push:
    branches: [main, testing]
    tags: ['v*']
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

# Default every job to read-only.  Only the protected Release job receives a
# write token after its tag ancestry and signing checks have passed.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_VERSION: '0.11.23'
    steps:
      # actions/checkout@v7.0.1, official Node 24 release verified 2026-08-14.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        # actions/setup-python@v7.0.0, official Node 24 release verified 2026-08-14.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lockfile tool
        run: |
          python -m pip install "uv==$UV_VERSION"

      - name: Verify dependency lockfiles
        # 固定索引快照，保证无输入变更时解析结果不漂移；升级依赖时显式推进此时间
        # 并重生成两份锁（步骤见 CLAUDE.md「依赖升级」）。
        # 2026-08-07 推进：cryptography 49.0.0 命中 PYSEC-2026-3552，修复版 50.0.0
        # 发布于 2026-07-31，晚于旧快照 2026-07-12，旧快照下 pip-audit 永远无法通过。
        env:
          UV_EXCLUDE_NEWER: '2026-08-07T00:00:00Z'
        run: |
          rm -f requirements.lock.txt requirements-dev.lock.txt
          uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes --output-file requirements.lock.txt
          uv pip compile requirements-dev.in --universal --python-version 3.12 --generate-hashes --output-file requirements-dev.lock.txt
          git diff --exit-code -- requirements.lock.txt requirements-dev.lock.txt

      - name: Install locked dependencies
        run: uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: Run static checks
        run: ruff check src tools deploy tests --no-cache

      - name: Run security checks
        run: |
          bandit -r src tools deploy -ll -ii -q
          pip-audit -r requirements.lock.txt

      - name: Generate production dependency SBOM
        run: >-
          cyclonedx-py requirements requirements.lock.txt
          --spec-version 1.6
          --output-reproducible
          --output-format JSON
          --output-file sbom.cdx.json

      - name: Upload dependency SBOM
        # actions/upload-artifact@v7.0.1, official Node 24 release verified 2026-08-14.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ombre-brain-python-sbom
          path: sbom.cdx.json

      - name: Run full local suite with coverage
        run: >-
          python -m pytest tests -q
          --asyncio-mode=auto
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Run LLM quality tests
        if: env.OMBRE_COMPRESS_API_KEY != ''
        env:
          OMBRE_COMPRESS_API_KEY: ${{ secrets.OMBRE_COMPRESS_API_KEY }}
        run: python -m pytest tests/test_llm_quality.py -v --asyncio-mode=auto

      - name: Start isolated Docker MCP stack
        run: |
          docker network create ob-ci-net
          docker volume create ob-ci-data
          docker run -d --name ob-ci-llm --network ob-ci-net \
            -v "$PWD:/workspace:ro" -w /workspace python:3.12-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36 \
            python tests/mcp_llm_stub.py
          docker build --build-arg "OMBRE_BUILD_COMMIT=${GITHUB_SHA}" -t ombre-brain-ci:local .
          docker run -d --name ob-ci-app --network ob-ci-net \
            -p 127.0.0.1:18084:8000 \
            -v ob-ci-data:/app/buckets \
            -e OMBRE_COMPRESS_MODEL=ombre-stub \
            -e OMBRE_COMPRESS_API_FORMAT=openai_compat \
            -e OMBRE_COMPRESS_API_KEY=audit-key \
            -e OMBRE_COMPRESS_BASE_URL=http://ob-ci-llm:8080/v1 \
            -e OMBRE_INSECURE_LOCAL_HOSTS=ob-ci-llm \
            -e OMBRE_MCP_RATE_LIMIT_PROFILE=integration-test \
            -e OMBRE_INTEGRATION_TEST=true \
            -e OMBRE_MCP_REQUIRE_AUTH=false \
            -e OMBRE_BIND_ADDRESS=127.0.0.1 \
            -e OMBRE_SETUP_TOKEN=docker-audit-setup-token \
            ombre-brain-ci:local
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:18084/health && break
            if [ "$attempt" -eq 60 ]; then
              docker logs ob-ci-app
              exit 1
            fi
            sleep 1
          done

      - name: Run 15-tool Docker MCP integration suite
        env:
          OMBRE_DOCKER_INTEGRATION_URL: http://127.0.0.1:18084/mcp
          OMBRE_DOCKER_EXPECT_COMPRESSION_PROVIDER: "1"
        run: >-
          python -m pytest tests/test_mcp_tools_docker_integration.py -q
          --timeout=60

      - name: Run Docker Web management integration suite
        env:
          OMBRE_DOCKER_WEB_BASE_URL: http://127.0.0.1:18084
          OMBRE_DOCKER_SETUP_TOKEN: docker-audit-setup-token
        run: >-
          python -m pytest tests/test_web_api_docker_integration.py -q
          --timeout=120

      - name: Clean Docker MCP stack
        if: always()
        run: |
          docker rm -f ob-ci-app ob-ci-llm || true
          docker volume rm ob-ci-data || true
          docker network rm ob-ci-net || true

  release:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment: official-release
    steps:
      # actions/checkout@v7.0.1, official Node 24 release verified 2026-08-14.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Explicit ref leaves commit unset in checkout, preserving the
          # annotated tag object required by the release provenance gate.
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python for signing
        # actions/setup-python@v7.0.0, official Node 24 release verified 2026-08-14.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate annotated version tag and reviewed ancestry
        run: |
          set -eu
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          tag_version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$tag_version"
          test "$(tr -d '[:space:]' < VERSION)" = "$tag_version"
          test "$(tr -d '[:space:]' < src/VERSION)" = "$tag_version"

      - name: Build update payload without signing credentials
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          python -m pip install --require-hashes -r requirements.lock.txt
          python deploy/gen_update_manifest.py
          stage="$(mktemp -d)"
          mkdir -p "$stage/Ombre-Brain-$version"
          git archive --format=tar HEAD | tar -xf - -C "$stage/Ombre-Brain-$version"
          cp update_manifest.json "$stage/Ombre-Brain-$version/update_manifest.json"
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/ombre-brain-update-v$version.zip" "Ombre-Brain-$version")
      - name: Sign verified update payload
        env:
          OMBRE_UPDATE_SIGNING_KEY_B64: ${{ secrets.OMBRE_UPDATE_SIGNING_KEY_B64 }}
        run: |
          set -eu
          public_key_b64="$(sed -n 's/^OFFICIAL_RELEASE_PUBLIC_KEY_B64 = "\([^"]*\)".*/\1/p' src/ombrebrain/security/release_signing.py)"
          test -n "$public_key_b64"
          test -n "$OMBRE_UPDATE_SIGNING_KEY_B64"
          version="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          OMBRE_RELEASE_PUBLIC_KEY_B64="$public_key_b64" python - "$version" "$commit" <<'PY'
          import base64, hashlib, json, os, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          version, commit = sys.argv[1:]
          name = f"ombre-brain-update-v{version}.zip"
          with open(name, "rb") as f: payload = f.read()
          manifest = {"schema_version": 1, "key_id": "ombre-release-2026-1", "version": version, "commit": commit, "asset": {"name": name, "sha256": hashlib.sha256(payload).hexdigest(), "size": len(payload)}}
          canonical = json.dumps(manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          private = Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["OMBRE_UPDATE_SIGNING_KEY_B64"], validate=True))
          public = base64.b64encode(private.public_key().public_bytes_raw()).decode()
          assert public == os.environ["OMBRE_RELEASE_PUBLIC_KEY_B64"]
          open("release-manifest.json", "wb").write(canonical)
          open("release-manifest.sig", "wb").write(base64.b64encode(private.sign(canonical)))
          PY

      - name: Create official signed Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          ombre-brain-update-v${GITHUB_REF_NAME#v}.zip
          release-manifest.json release-manifest.sig
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, release]
    # Signed version tags only. `latest` and the semver tag are emitted by the
    # same verified Release commit; branch pushes never overwrite either tag.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      # actions/checkout@v7.0.1, official Node 24 release verified 2026-08-14.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read version from VERSION file
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action@v3, official tag commit verified 2026-08-10.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to Docker Hub
        # docker/login-action@v3, official tag commit verified 2026-08-10.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: thomas1997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        # docker/build-push-action@v6, official tag commit verified 2026-08-10.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            thomas1997/ombre-brain:latest
            thomas1997/ombre-brain:${{ steps.ver.outputs.version }}
          build-args: |
            OMBRE_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
