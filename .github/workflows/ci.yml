name: CI

# 一次 push 只出一个 workflow，内含两个 job：
#   test           —— 锁校验 / ruff / bandit+pip-audit / SBOM / 全量单测 / Docker 集成测试
#   build-and-push —— 构建 amd64+arm64 镜像并推 Docker Hub（needs: test，测试不过就不发布）
#
# 合并前这是两个独立文件，互不依赖并行跑：Tests 红着的 commit 照样会把镜像推成
# :latest（2026-08-07 实际发生过一次）。现在 build 由 needs 串在 test 之后。
#
# 唯一需要保密的是 token，只存在 GitHub 仓库 Secrets（绝不写进代码）：
#   DOCKERHUB_TOKEN = Docker Hub Access Token（用 token，不要用账号密码）
# 设置位置：仓库 → Settings → Secrets and variables → Actions → New repository secret
#
# 用户名不走 Secret：它已经明文出现在下面的镜像 tag 里（thomas1997/ombre-brain），
# 本身不是机密。放进 Secret 只会多一个「忘了配就登录失败」的失败点。

on:
  push:
    branches: [main, testing]
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_VERSION: '0.11.23'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lockfile tool
        run: |
          python -m pip install "uv==$UV_VERSION"

      - name: Verify dependency lockfiles
        # 固定索引快照，保证无输入变更时解析结果不漂移；升级依赖时显式推进此时间
        # 并重生成两份锁（步骤见 CLAUDE.md「依赖升级」）。
        # 2026-08-07 推进：cryptography 49.0.0 命中 PYSEC-2026-3552，修复版 50.0.0
        # 发布于 2026-07-31，晚于旧快照 2026-07-12，旧快照下 pip-audit 永远无法通过。
        env:
          UV_EXCLUDE_NEWER: '2026-08-07T00:00:00Z'
        run: |
          rm -f requirements.lock.txt requirements-dev.lock.txt
          uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes --output-file requirements.lock.txt
          uv pip compile requirements-dev.in --universal --python-version 3.12 --generate-hashes --output-file requirements-dev.lock.txt
          git diff --exit-code -- requirements.lock.txt requirements-dev.lock.txt

      - name: Install locked dependencies
        run: uv pip sync requirements-dev.lock.txt --require-hashes --system

      - name: Run static checks
        run: ruff check src tools deploy tests --no-cache

      - name: Run security checks
        run: |
          bandit -r src tools deploy -ll -ii -q
          pip-audit -r requirements.lock.txt

      - name: Generate production dependency SBOM
        run: >-
          cyclonedx-py requirements requirements.lock.txt
          --spec-version 1.6
          --output-reproducible
          --output-format JSON
          --output-file sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ombre-brain-python-sbom
          path: sbom.cdx.json

      - name: Run full local suite with coverage
        run: >-
          python -m pytest tests -q
          --asyncio-mode=auto
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Run LLM quality tests
        if: env.OMBRE_COMPRESS_API_KEY != ''
        env:
          OMBRE_COMPRESS_API_KEY: ${{ secrets.OMBRE_COMPRESS_API_KEY }}
        run: python -m pytest tests/test_llm_quality.py -v --asyncio-mode=auto

      - name: Start isolated Docker MCP stack
        run: |
          docker network create ob-ci-net
          docker volume create ob-ci-data
          docker run -d --name ob-ci-llm --network ob-ci-net \
            -v "$PWD:/workspace:ro" -w /workspace python:3.12-slim \
            python tests/mcp_llm_stub.py
          docker build --build-arg "OMBRE_BUILD_COMMIT=${GITHUB_SHA}" -t ombre-brain-ci:local .
          docker run -d --name ob-ci-app --network ob-ci-net \
            -p 127.0.0.1:18084:8000 \
            -v ob-ci-data:/app/buckets \
            -e OMBRE_COMPRESS_MODEL=ombre-stub \
            -e OMBRE_COMPRESS_API_FORMAT=openai_compat \
            -e OMBRE_COMPRESS_API_KEY=audit-key \
            -e OMBRE_COMPRESS_BASE_URL=http://ob-ci-llm:8080/v1 \
            -e OMBRE_MCP_REQUIRE_AUTH=false \
            -e OMBRE_BIND_ADDRESS=127.0.0.1 \
            -e OMBRE_SETUP_TOKEN=docker-audit-setup-token \
            ombre-brain-ci:local
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:18084/health && break
            if [ "$attempt" -eq 60 ]; then
              docker logs ob-ci-app
              exit 1
            fi
            sleep 1
          done

      - name: Run 15-tool Docker MCP integration suite
        env:
          OMBRE_DOCKER_INTEGRATION_URL: http://127.0.0.1:18084/mcp
          OMBRE_DOCKER_EXPECT_COMPRESSION_PROVIDER: "1"
        run: >-
          python -m pytest tests/test_mcp_tools_docker_integration.py -q
          --timeout=60

      - name: Run Docker Web management integration suite
        env:
          OMBRE_DOCKER_WEB_BASE_URL: http://127.0.0.1:18084
          OMBRE_DOCKER_SETUP_TOKEN: docker-audit-setup-token
        run: >-
          python -m pytest tests/test_web_api_docker_integration.py -q
          --timeout=120

      - name: Clean Docker MCP stack
        if: always()
        run: |
          docker rm -f ob-ci-app ob-ci-llm || true
          docker volume rm ob-ci-data || true
          docker network rm ob-ci-net || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # 只有 main 才发布镜像：testing 分支和 PR 跑完 test 就够了，不该产出 :latest。
    # PR 事件的 github.ref 是 refs/pull/N/merge，本身已被这个条件排除；
    # 保留 event_name 判断是为了让意图直接写在脸上。
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: thomas1997
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            thomas1997/ombre-brain:latest
            thomas1997/ombre-brain:${{ steps.ver.outputs.version }}
          build-args: |
            OMBRE_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
